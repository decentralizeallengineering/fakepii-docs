[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fakepii-docs"
version = "0.1.0"
description = "Synthetic office documents full of FAKE personal data, with exact ground truth, for testing masking/unmasking systems."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.2",
    "python-pptx>=1.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "fpdf2>=2.8",
    "numpy>=1.26",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fakepii-docs = "fakepii_docs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fakepii_docs = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
